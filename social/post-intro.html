<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%}
  .card{width:100vw;height:100vh;box-sizing:border-box;padding:8vh 7vw;display:flex;flex-direction:column;justify-content:space-between;
    background:radial-gradient(circle at 75% 15%,#241b4d,#0a0b10 70%);font-family:'Inter',sans-serif;color:#eef1f7}
  .top{display:flex;align-items:center;gap:1.2vw;font-family:'Space Grotesk';font-weight:700;font-size:3.2vw}
  .top .d{color:#19d3c5}
  h1{font-family:'Space Grotesk';font-weight:800;font-size:7.2vw;line-height:1.08;letter-spacing:-.02em;margin:0}
  h1 .g{background:linear-gradient(120deg,#7c5cff,#19d3c5);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:3.4vw;color:#9aa3b2;margin-top:3vh;line-height:1.5}
  .pills{display:flex;gap:1.5vw;flex-wrap:wrap}
  .pill{border:1px solid #2a2f40;border-radius:999px;padding:1.4vh 2.4vw;font-size:2.7vw;color:#cdd3df}
</style></head>
<body><div class="card">
  <div class="top"><span class="d">◆</span> Lifelutions</div>
  <div>
    <h1>Websites &amp; <span class="g">AI chatbots</span> for small businesses.</h1>
    <div class="sub">Modern sites, AI that answers customers 24/7, and automations that kill the busywork.</div>
  </div>
  <div class="pills"><span class="pill">⚡ Live in 48 hours</span><span class="pill">💰 Fixed price</span><span class="pill">📍 Toronto</span></div>
</div></body></html>
